<style>
/* layout: one full-bleed canvas; the only UI is the start title, the composer and the hidden #test panel */
:root{
  --ink:#161412; --cream:#fbf9f3; --orange:#E8561B; --deep:#b03a0e; --mute:#6b5f55; --line:#d9cfc2;
  --f-wenkai:'LXGW WenKai TC','Klee One','Noto Serif TC',serif;
  --f-sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --f:var(--f-wenkai);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--f);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.6s ease}
#start h1{margin:0;font:400 clamp(30px,7vw,54px)/1 var(--f);letter-spacing:.35em;padding-left:.35em;color:var(--ink);background:rgba(251,249,243,.72);padding:.5em .6em .5em .95em}
#start.gone{opacity:0;pointer-events:none}
#start .st{display:flex;flex-direction:column;align-items:center;gap:14px}
#start .tap{display:flex;align-items:center;gap:10px;font:400 15px/1 var(--f);letter-spacing:.08em;color:var(--mute);padding:.55em 1em;text-shadow:0 0 6px var(--cream),0 0 12px var(--cream);animation:breath 3.2s ease-in-out infinite}
#start .drop{display:block;width:10px;height:10px;border-radius:50%;background:var(--orange);animation:bob 1.6s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.15)}}
#compose{position:fixed;inset:0;display:flex;opacity:0;transition:opacity .6s ease;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;background:rgba(251,249,243,.55);z-index:10;-webkit-user-select:text;user-select:text;touch-action:auto}
.card{transform:translateY(14px);transition:transform .7s cubic-bezier(.2,.7,.2,1);width:min(460px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--cream);border:1.5px solid var(--ink);padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px;font-family:var(--f)}
.card h2{margin:0;font:400 19px/1.55 var(--f);text-wrap:balance}
.card .lab{font:500 12px var(--f-sans);letter-spacing:.14em;color:var(--mute)}
.presets{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto;padding-right:2px}
.presets button,.words button{font:400 15px/1.45 var(--f);text-align:left;background:transparent;border:1px solid var(--line);color:var(--ink);padding:7px 11px;cursor:pointer}
.presets button[aria-pressed="true"],.words button[aria-pressed="true"]{border-color:var(--orange);background:rgba(232,86,27,.1)}
.blank{font:400 16px/1.9 var(--f);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.blank input{font:400 16px var(--f);width:9.5em;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:2px 4px;color:var(--deep);outline:none}
.blank input:focus{border-bottom-color:var(--orange)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words button{padding:4px 10px;font-size:14px}
.lab .more{float:right;font:400 13px/1.6 var(--f);background:none;border:0;padding:0 2px;color:var(--deep);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.err{min-height:1.4em;font:400 13px var(--f-sans);color:var(--deep)}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.acts button{font:500 15px var(--f);padding:8px 16px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.acts .go{background:var(--orange);border-color:var(--orange);color:var(--cream)}
.acts .go:disabled{opacity:.4;cursor:default}
#compose.show{opacity:1}#compose.show .card{transform:none}
@media (prefers-reduced-motion:reduce){#compose,.card{transition:none}#start .tap,#start .drop{animation:none}}
button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#test{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,env(safe-area-inset-right,0px));z-index:20;background:rgba(22,20,18,.9);color:var(--cream);font:500 12px var(--f-sans);padding:10px 12px;display:flex;flex-direction:column;gap:7px;max-width:250px;touch-action:auto}
#test b{letter-spacing:.12em;color:#f2a27a}
#test label{display:flex;justify-content:space-between;gap:8px;align-items:center}
#test select,#test button{font:500 12px var(--f-sans);background:#2a2623;color:var(--cream);border:1px solid #6b5f55;padding:3px 4px}
#test button{cursor:pointer}
#test .row{display:flex;gap:6px;flex-wrap:wrap}
#test .chk{display:flex;gap:6px;align-items:center;justify-content:flex-start}
</style>

<canvas id="c" aria-label="匯聚洋流：操控一顆小水滴在洋流裡漂流"></canvas>
<div id="start" role="button" tabindex="0" aria-label="點一下，成為小水滴"><div class="st"><h1>匯聚洋流</h1><div class="tap"><i class="drop"></i><span>點一下，成為小水滴</span></div></div></div>

<div id="compose" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cTitle">
    <h2 id="cTitle"></h2>
    <div class="lab">挑一句<button type="button" class="more" id="cMore">換一組</button></div>
    <div class="presets" id="cPresets"></div>
    <div class="lab">或是填空</div>
    <div class="blank"><span id="cBefore"></span><input id="cInput" maxlength="8" autocomplete="off" aria-label="填空"><span id="cAfter"></span></div>
    <div class="words" id="cWords"></div>
    <div class="err" id="cErr" aria-live="polite"></div>
    <div class="acts"><button id="cNo">先不要</button><button class="go" id="cGo" disabled>放進洋流</button></div>
  </div>
</div>

<div id="test" hidden>
  <b>試玩設定</b>
  <label>台詞字型<select id="tFont"><option value="wenkai">霞鶩文楷</option><option value="sans">思源黑體</option><option value="serif">思源宋體</option></select></label>
  <label>一輪長度<select id="tLen"><option value="20">約 2 分鐘（20 滴）</option><option value="40">約 3–5 分鐘（40 滴）</option></select></label>
  <label>尾聲文字<select id="tEnd"><option value="none">不要字</option><option value="date">11.28</option><option value="line">一點一滴，匯成洋流</option></select></label>
  <label>台詞重疊<select id="tOver"><option value="spread">各自錯開</option><option value="queue">排隊</option><option value="replace">新的推走舊的</option></select></label>
  <label>島內流法<select id="tIsland"><option value="A">繞全島一大圈</option><option value="AT">大圈，中心在台北</option><option value="AV">大圈＋台北漩渦</option><option value="C">北→南＋漩渦</option></select></label>
  <label>外島的流<select id="tIsle"><option value="loop">繞島一圈</option><option value="wake">繞過島留尾流</option><option value="dens">只用疏密</option></select></label>
  <label>可游範圍<select id="tBound"><option value="near">澎湖綠島蘭嶼一帶</option><option value="mid">海峽中線附近</option><option value="view">看得到台灣一角</option></select></label>
  <label>邀請呈現<select id="tInv"><option value="float">漂來漂去</option><option value="follow">跟著你的水滴</option><option value="bottom">下方中央呼吸</option></select></label>
  <label>海峽<select id="tStrait"><option value="south">整片往南</option><option value="side">兩股並排</option><option value="west">交會轉向西</option></select></label>
  <label>尾聲台灣大小<select id="tTws"><option value="75">高度約 75%</option><option value="90">高度約 90%</option><option value="auto">直向 75%／橫向 90%</option></select></label>
  <label>漂移速度<select id="tDrift"><option value="1">×1</option><option value="2">×2</option><option value="3">×3</option></select></label>
  <label>旋律對應<select id="tMel"><option value="finish">一滴一音，尾聲接完</option><option value="bar">一滴一小節</option><option value="note">一滴一音，彈到哪算哪</option></select></label>
  <label>尾聲水滴數<select id="tEpN"><option value="80">約 80 顆</option><option value="150">約 150 顆</option><option value="300">約 300 顆</option></select></label>
  <label>外島放大<select id="tIsleS"><option value="1">原尺寸</option><option value="1.6">約 1.6 倍</option><option value="2">約 2 倍</option></select></label>
  <label>停下時鏡頭<select id="tCam"><option value="hold">停在原地</option><option value="follow">跟著你、別人漂得快</option></select></label>
  <b>外島輪廓（可疊加）</b>
  <label class="chk"><input type="checkbox" id="isleLines">外島上自己的一組線</label>
  <label class="chk"><input type="checkbox" id="isleDark">尾聲時外島的線深一點</label>
  <b>交匯線修法（可疊加）</b>
  <label class="chk"><input type="checkbox" id="proj">不會匯聚的流</label>
  <label class="chk"><input type="checkbox" id="jit">水滴帶隨機晃動</label>
  <label class="chk"><input type="checkbox" id="wide">轉換帶加寬</label>
  <b>尾聲的字（可疊加）</b>
  <label class="chk"><input type="checkbox" id="endHalo">字後面淡淡的光暈</label>
  <label class="chk"><input type="checkbox" id="endDim">中間一圈暫時變淡</label>
  <b>節奏（可疊加）</b>
  <label class="chk"><input type="checkbox" id="pWait">要停久一點才有人來</label>
  <label class="chk"><input type="checkbox" id="pMax">同時最多兩顆朝你來</label>
  <label class="chk"><input type="checkbox" id="pSlow">靠近得更慢</label>
  <label class="chk"><input type="checkbox" id="pPair">先並排漂一下才融合</label>
  <div class="row"><button id="tSkip">直接到門檻</button><button id="tClear">清除我留的那滴</button></div>
  <span id="tInfo" style="color:#c9bfb2"></span>
</div>

<script>
(function(){
'use strict';
// ---------- palette ----------
const INK=[22,20,18], CREAM=[251,249,243], OR=[232,86,27];
const ORS=[[176,58,14],[232,86,27],[244,150,104]];
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);

// ---------- data (files override these fallbacks) ----------
let LINES=["我也以為只有我在乎。","原來你也在這裡。","一滴水推不動什麼，可是我們不只一滴。","慢一點沒關係，我們一起漂。","回頭看，好多人。","十一月二十八日，見。"];
let COMPOSE={inviteShort:"加入洋流",title:"要不要成為一滴水，尋找並陪伴下一個小水滴？",presets:LINES.slice(),blank:{before:"這次，我想為",after:"站出來。",maxLen:8,words:["家人","孩子","這座城市","台灣"]}};
let FILTER={words:["幹","白痴","智障","去死"],patterns:["https?://","\\d{5,}"]};
let MELODY=[],BARS=[],BPM=76;   // bars of [note, beats]; empty → random pentatonic pitch
const load=(u)=>fetch(u).then(r=>r.ok?r.json():Promise.reject()).catch(()=>null);
Promise.all([load('data/lines.json'),load('data/compose.json'),load('data/filter.json'),load('data/melody.json')]).then(([l,c,f,m])=>{
  if(m&&Array.isArray(m.bars)){BARS=m.bars;MELODY=BARS.flat();BPM=m.bpm||76}
  if(l&&Array.isArray(l.lines)&&l.lines.length)LINES=l.lines;
  if(c&&c.presets)COMPOSE=c;
  if(f&&f.words)FILTER=f;
  linePool=shuffle(poolLines());preloadGlyphs();
  pullLines();retryPending();
});
// ---------- shared current (Supabase): everyone's lines ----------
const SB_URL='https://fcbdxrrwfpmxexivtttu.supabase.co',SB_KEY='sb_publishable_zBrPut3QwqBZjXvazO5liA_h8RTEdc5';
function deviceId(){let d=null;try{d=localStorage.getItem('hl-device')}catch(e){}
  if(!d||!/^[A-Za-z0-9-]{8,64}$/.test(d)){d=(crypto.randomUUID?crypto.randomUUID():'d'+Math.random().toString(36).slice(2)+Date.now().toString(36));try{localStorage.setItem('hl-device',d)}catch(e){}}return d}
function rpc(name,body,ms){const ac=new AbortController();const to=setTimeout(()=>ac.abort(),ms);
  return fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',signal:ac.signal,headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(r=>r.ok?r.json():Promise.reject(r.status)).finally(()=>clearTimeout(to))}
function pullLines(){   // 3 s or fall back to the built-in lines
  rpc('get_lines',{},3000).then(g=>{const cur=Array.isArray(g.curated)?g.curated:[],pl=Array.isArray(g.players)?g.players:[];
    const ok=x=>typeof x==='string'&&x.trim();
    if(cur.filter(ok).length)LINES=[...new Set(cur.filter(ok))];PLAYERS=g.closed?[]:pl.filter(ok);
    linePool=shuffle(poolLines());S.online=true;preloadGlyphs()}).catch(()=>{S.online=false})}
function pushLine(text){rpc('submit_line',{p_text:text,p_device:deviceId()},8000).then(r=>{
    if(r&&(r.ok||r.reason==='blocked'||r.reason==='length'))setPending(false);else setPending(true)}).catch(()=>setPending(true))}
function setPending(v){try{const m=JSON.parse(localStorage.getItem('hl-mydrop')||'null');if(m){m.pending=v;localStorage.setItem('hl-mydrop',JSON.stringify(m))}}catch(e){}}
function retryPending(){if(isEDay())return;try{const m=JSON.parse(localStorage.getItem('hl-mydrop')||'null');if(m&&m.pending&&m.text)pushLine(m.text)}catch(e){}}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let linePool=[];
// ---------- election day (Taipei date): curated only, no vote words, no new lines ----------
const ELECTION='2026-11-28',VOTE_RE=/投票|票|十一月二十八|11\/28/;let FAKE_DATE=null,PLAYERS=[];
const today=()=>FAKE_DATE||new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const isEDay=()=>today()===ELECTION;
function poolLines(){if(isEDay()){const c=LINES.filter(x=>!VOTE_RE.test(x));return c.length?c:['回頭看，好多人。']}
  return [...new Set([...LINES,...PLAYERS])]}
function nextLine(){if(!linePool.length)linePool=shuffle(poolLines());return linePool.pop()}

// ---------- settings (#test) ----------
const TURN=4,BLUR=false,BA=0,BB=0.07,CA=0.05,CB=0.15;   // lines turn with inertia only away from the coast (outline stays exact); contour blur off (it broke Taiwan's shape)
const T={font:'serif',len:20,end:'line',over:'spread',pWait:true,pMax:false,pSlow:true,pPair:false,island:'AV',strait:'side',tws:'90',drift:2,mel:'finish',isle:'loop',bound:'mid',endHalo:true,endDim:true,inv:'bottom',epN:150,proj:true,jit:true,wide:true,isleS:1.6,cam:'hold',isleLines:true,isleDark:true};
try{Object.assign(T,JSON.parse(localStorage.getItem('hl-test6')||'{}'))}catch(e){}
const FONTS={wenkai:"'LXGW WenKai TC','Klee One',serif",sans:"'Noto Sans TC',sans-serif",serif:"'Noto Serif TC',serif"};
function applyFont(){document.documentElement.style.setProperty('--f',`var(--f-${T.font})`);preloadGlyphs()}
const UI_TXT='匯聚洋流為一點一滴，匯成洋流。11.28按住拖動移動滑鼠，或用方向鍵想留的時候，點一下你的水滴0123456789';
function preloadGlyphs(){if(!document.fonts||!document.fonts.load)return;   // fetch the font slices for every line now, so nothing stalls when a line first appears
  const txt=[...new Set((UI_TXT+(COMPOSE.inviteShort||'')+LINES.join('')+PLAYERS.join('')+(COMPOSE.presets||[]).join('')).replace(/\s/g,''))].join('');const fam=FONTS[T.font].split(',')[0];
  for(const w of [400,600])document.fonts.load(`${w} 16px ${fam}`,txt).catch(()=>{});
  document.fonts.load("16px 'Klee One'",'為').catch(()=>{})}
applyFont();

// ---------- canvas ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});   // opaque: the background is painted every frame
let W=1,H=1,DPR=1,K=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;K=Math.sqrt(W*H)/900;buildPools()}

// ---------- world state ----------
const S={
  t:Math.random()*50, phase:'title', // title → play → handoff → epilogue → free
  px:0,py:0,pvx:0,pvy:0, n:0, R0:14,
  zoom:1, ez:1, uz:1, camx:0,camy:0,
  lastInput:-99, pointer:null, pressed:false, keys:{}, mouseIn:false,
  others:[], absorb:[], labels:[], words:[], vort:[],
  epT:0, e:0, tw:null, endA:0, inviteOn:false, inviteT:0, composed:false,
  myDrop:null, mySpawned:false, fx:[], steerT:0, playT:0, tutA:0, mergeClock:0, pS:0
};
let fl=[],parts=[],twl=[],BASE=0,lineScale=1,isleLines=[];
const total=()=>+T.len;
const prog=()=>Math.min(1,S.n/total());
const radius=()=>Math.sqrt(S.R0*S.R0+S.n*81);
const zf=()=>S.zoom*S.ez;
const VIS=()=>Math.pow(Math.min(1,S.zoom),0.5);   // things look smaller and slower as the camera pulls back
const VISL=()=>{const v=VIS(),k=ease(S.e||0);return v+(1-v)*k};   // line/particle speed: restored during the epilogue
// the current gets clearer: a little with every merge, much more in the epilogue (only the darker lines deepen)
const lineBoost=()=>0.3*S.pS+0.5*ease(S.e||0);
const lineW=()=>0.6+(TOUCH?0.3*ease(S.e||0)*clamp((1000-Math.min(W,H))/600,0,1):0);   // phones: thicker hairlines in the epilogue               // field scale: keeps line texture constant on screen while the camera pulls back
const Z=()=>0.5*S.zoom*S.ez*S.uz;       // world → screen
function view(){const z=Z();return{z,hw:W/2/z,hh:H/2/z}}

// ---------- geography: the whole game takes place in Taiwan ----------
const G=20000;                                  // world units per degree of latitude
const CLAT=Math.cos(23.6*Math.PI/180);
const geo=(lon,lat)=>[(lon-121)*CLAT*G,-(lat-23.6)*G];
const ungeo=(x,y)=>[x/(CLAT*G)+121,23.6-y/G];
const TW=[[121.54,25.30],[121.62,25.22],[121.75,25.17],[121.90,25.12],[122.00,25.01],[121.88,24.84],[121.83,24.62],[121.86,24.55],[121.73,24.30],[121.61,24.00],[121.53,23.70],[121.40,23.25],[121.24,22.93],[121.07,22.68],[120.92,22.33],[120.85,21.90],[120.73,21.93],[120.62,22.30],[120.45,22.48],[120.28,22.60],[120.17,22.95],[120.08,23.25],[120.15,23.60],[120.28,23.90],[120.43,24.15],[120.62,24.45],[120.90,24.80],[121.05,25.04],[121.30,25.12],[121.43,25.20]].map(([lo,la])=>geo(lo,la));
const START=geo(121.52,25.04);                  // Taipei
const TWC=(()=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of TW){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}return{cx:(x0+x1)/2,cy:(y0+y1)/2,w:x1-x0,h:y1-y0}})();
const nz=v=>{const L=Math.hypot(v[0],v[1])||1;return[v[0]/L,v[1]/L]};
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

    const ca=Math.cos(a),sa=Math.sin(a);const r=Math.min(hw/Math.max(1e-3,Math.abs(ca)),hh/Math.max(1e-3,Math.abs(sa)))*(amb?1.04:1.12);

  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
  verb.buffer=ir;const vg=C.createGain();vg.gain.value=0.35;verb.connect(vg);vg.connect(master);A.verb=verb;
  // water: slow waves, about one swell every nine seconds
  const nb=C.createBuffer(2,C.sampleRate*5,C.sampleRate);for(let ch=0;ch<2;ch++){const d=nb.getChannelData(ch);let p0=0,p1=0,p2=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;p0=0.99765*p0+w*0.099;p1=0.963*p1+w*0.2965;p2=0.57*p2+w*1.0526;d[i]=(p0+p1+p2+w*0.1848)*0.18}}

  const mk=(freqs,type,g)=>{const gn=C.createGain();gn.gain.value=0;gn.connect(pf);for(const f of freqs){for(const dt of[-3,3]){const o=C.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=dt;const og=C.createGain();og.gain.value=g;o.connect(og);og.connect(gn);o.start()}}return gn};

const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];

}

  // flowing words

  const pxs=S.px,pys=S.py;for(const w of S.words){const near=clamp((Math.hypot(w.x-pxs,w.y-pys)*z-60)/140,0.15,1);const a=Math.min(1,w.age/2)*0.42*near;if(a<=0)continue;const ss=w.size*z;if(ss<3)continue;const sz=ss>15?15/z:w.size;c.fillStyle=rgba(INK,a*(ss>15?Math.max(0.25,15/ss):1));fillText(c,w.text,w.x,w.y,sz)}
  // droplets

  {const br=1+0.07*Math.sin(t*2.2);let pop=1;for(const e of S.fx)if(e.t<0.45)pop=Math.max(pop,1+0.15*Math.sin(Math.PI*e.t/0.45));

    const hR=Math.max(pr*3.2,pr+16/z),hg=c.createRadialGradient(S.px,S.py,pr*0.8,S.px,S.py,hR);hg.addColorStop(0,rgba(OR,0.42*(0.75+0.25*Math.sin(t*2.2))));hg.addColorStop(0.5,rgba(OR,0.14*(0.75+0.25*Math.sin(t*2.2))));hg.addColorStop(1,rgba(OR,0));c.fillStyle=hg;c.beginPath();c.arc(S.px,S.py,hR,0,7);c.fill();

    dot(S.px,S.py,pr)}

  if(S.endA>0&&T.endDim){const g=c.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*0.42);g.addColorStop(0,rgba(CREAM,0.62*S.endA));g.addColorStop(1,rgba(CREAM,0));c.fillStyle=g;c.fillRect(0,0,W,H)}

    if(T.endHalo){const sz=T.end==='date'?Math.min(56,W*0.11):Math.min(28,W*0.062);const tw=T.end==='date'?sz*3:measure(c,'一點一滴，匯成洋流',sz);c.save();c.translate(W/2,H/2);c.scale((tw*0.75+sz*1.5)/(sz*2.2),1);const g=c.createRadialGradient(0,0,0,0,0,sz*2.2);g.addColorStop(0,rgba(CREAM,0.92*S.endA));g.addColorStop(0.6,rgba(CREAM,0.7*S.endA));g.addColorStop(1,rgba(CREAM,0));c.fillStyle=g;c.fillRect(-sz*2.2,-sz*2.2,sz*4.4,sz*4.4);c.restore()}
    c.fillStyle=rgba(INK,S.endA*0.88);

    const txt=TOUCH?'按住任何地方滑動':'移動滑鼠，或用方向鍵';c.textAlign='center';c.textBaseline='middle';c.fillStyle=rgba(INK,0.7*a);fillText(c,txt,W/2,H-Math.max(64,H*0.12),sz);
}

  inviteBox=null;

    if(T.inv==='follow'){const sx=(S.px-S.camx)*z+W/2,sy=(S.py-S.camy)*z+H/2;x=clamp(sx,80,W-80);y=clamp(sy+Math.max(radius()*z,6)+size*1.6,size*2,H-size*2)}

    else{y=H*0.5+Math.sin(S.inviteT*0.4)*H*0.18;x=W/2+Math.sin(S.inviteT*0.23)*W*0.18}
    c.textAlign='center';c.textBaseline='middle';const wdt=measure(c,txt,size);const hov=S.invHover?1:0;
    c.fillStyle=hov?rgba(OR,a):rgba(CREAM,0.78*a);c.fillRect(x-wdt/2-14,y-size*0.95,wdt+28,size*1.9);
    c.fillStyle=hov?rgba(CREAM,a):rgba(ORS[0],a*br);fillText(c,txt,x,y,size,hov?600:400);inviteBox={x0:x-wdt/2-14,x1:x+wdt/2+14,y0:y-size,y1:y+size}}
}
function dot(x,y,r){const c=ctx;c.fillStyle=rgba(OR,1);c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle=rgba(CREAM,0.85);c.beginPath();c.ellipse(x-r*0.34,y-r*0.36,r*0.24,r*0.13,-0.7,0,7);c.fill()}
function neck(x,y,r){const c=ctx;const R=radius();const dx=S.px-x,dy=S.py-y,d=Math.hypot(dx,dy)||1;const nx=-dy/d,ny=dx/d;
  c.fillStyle=rgba(OR,1);c.beginPath();c.moveTo(x+nx*r*0.8,y+ny*r*0.8);c.quadraticCurveTo((x+S.px)/2,(y+S.py)/2,S.px+nx*R*0.5,S.py+ny*R*0.5);
  c.lineTo(S.px-nx*R*0.5,S.py-ny*R*0.5);c.quadraticCurveTo((x+S.px)/2,(y+S.py)/2,x-nx*r*0.8,y-ny*r*0.8);c.fill()}
function drawLabels(){const c=ctx,z=Z();const size=Math.max(13,Math.min(16,W*0.036));c.textAlign='left';c.textBaseline='middle';
  const near=[],held=[];const psx=(S.px-S.camx)*z+W/2,psy=(S.py-S.camy)*z+H/2,pr=radius()*z;
  for(const L of S.labels){const w=measure(c,L.text,size);
    if((L.state==='near'||L.state==='lost')&&L.d){L.wx=L.d.x;L.wy=L.d.y;const sx=(L.wx-S.camx)*z+W/2,sy=(L.wy-S.camy)*z+H/2;

    else{L.wx=S.px;L.wy=S.py;held.push({L,x:clamp(psx-w/2,12,W-12-w),y:0,w})}}

    let x=sx+10,y=sy-14;if(x+w>W-12)x=sx-10-w;near.push({L:p,x:clamp(x,12,W-12-w),y:clamp(y,size+6,H-size-6),w})}
